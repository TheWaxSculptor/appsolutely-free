<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-brkox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-brkox)"/>
  <circle cx="680" cy="80" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="120" cy="380" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Desk Workspace Illustration -->
  <g transform="translate(420, 110)">
    <!-- Monitor / Ultrawide Setup -->
    <rect x="0" y="30" width="320" height="190" rx="14" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="8" y="38" width="304" height="174" rx="8" fill="#020617"/>
    <!-- Code / Design wireframe lines on screen -->
    <rect x="25" y="60" width="120" height="12" rx="4" fill="#06b6d4" opacity="0.9"/>
    <rect x="25" y="82" width="200" height="8" rx="4" fill="#475569"/>
    <rect x="25" y="98" width="160" height="8" rx="4" fill="#334155"/>
    <rect x="25" y="114" width="230" height="8" rx="4" fill="#475569"/>
    <rect x="25" y="130" width="140" height="8" rx="4" fill="#334155"/>
    <!-- Glowing UI charts -->
    <rect x="180" y="60" width="105" height="45" rx="6" fill="#1e293b"/>
    <path d="M 195 90 L 220 75 L 245 82 L 270 68" stroke="#10b981" stroke-width="3" fill="none"/>
    <!-- Stand -->
    <rect x="145" y="220" width="30" height="50" fill="#334155"/>
    <rect x="110" y="270" width="100" height="10" rx="5" fill="#475569"/>
    <!-- Desk Surface Glow -->
    <ellipse cx="160" cy="275" rx="150" ry="8" fill="#06b6d4" opacity="0.4" filter="url(#glow)"/>
  </g>

  <!-- Typography & Badges -->
  <rect x="50" y="75" width="140" height="32" rx="16" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="120" y="96" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">⚡ TECH ESSENTIALS</text>

  <text x="50" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">BRKOX GEAR</text>
  <text x="50" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Premium Workspace &amp; Desk Tech</text>

  <g transform="translate(50, 245)">
    <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ Minimalist Aluminum Desk Accessories</text>
    <text x="0" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ Ergonomic Workstation Upgrades</text>
    <text x="0" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ Clean Cable &amp; Device Management</text>
  </g>

  <rect x="50" y="345" width="190" height="48" rx="8" fill="url(#cyan-glow)"/>
  <text x="145" y="375" fill="#020617" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle">SHOP BRKOX ↗</text>
</svg>
