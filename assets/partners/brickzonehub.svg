<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-brick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2a"/>
      <stop offset="50%" stop-color="#3b1348"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="pink-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow-bz" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-brick)"/>
  <circle cx="650" cy="120" r="150" fill="#ec4899" opacity="0.15" filter="url(#glow-bz)"/>
  <circle cx="150" cy="380" r="130" fill="#a855f7" opacity="0.15" filter="url(#glow-bz)"/>

  <!-- 3D Brick Model Graphic -->
  <g transform="translate(450, 100)">
    <!-- Base plate -->
    <polygon points="150,230 280,160 130,90 0,160" fill="#2d124d" stroke="#a855f7" stroke-width="2"/>
    <polygon points="0,160 150,230 150,250 0,180" fill="#1e0b36"/>
    <polygon points="150,230 280,160 280,180 150,250" fill="#280f45"/>

    <!-- Brick layer 1 -->
    <polygon points="150,170 230,125 140,80 60,125" fill="#ec4899" opacity="0.9"/>
    <polygon points="60,125 150,170 150,195 60,150" fill="#be185d"/>
    <polygon points="150,170 230,125 230,150 150,195" fill="#9d174d"/>

    <!-- Studs on top -->
    <ellipse cx="105" cy="110" rx="14" ry="7" fill="#f472b6"/>
    <ellipse cx="150" cy="132" rx="14" ry="7" fill="#f472b6"/>
    <ellipse cx="185" cy="110" rx="14" ry="7" fill="#f472b6"/>
    <ellipse cx="140" cy="88" rx="14" ry="7" fill="#f472b6"/>

    <!-- Accent floating bricks -->
    <polygon points="210,60 250,38 205,15 165,37" fill="#06b6d4" opacity="0.85"/>
    <polygon points="165,37 210,60 210,75 165,52" fill="#0891b2"/>
    <polygon points="210,60 250,38 250,53 210,75" fill="#0e7490"/>
    <ellipse cx="207" cy="38" rx="8" ry="4" fill="#67e8f9"/>
  </g>

  <!-- Typography & Badges -->
  <rect x="50" y="75" width="180" height="32" rx="16" fill="rgba(236,72,153,0.15)" stroke="#ec4899" stroke-width="1.5"/>
  <text x="140" y="96" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">🧱 CREATIVE HOBBY &amp; ART</text>

  <text x="50" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="-1">BRICKZONEHUB</text>
  <text x="50" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Intricate Building Kits &amp; Maker Sets</text>

  <g transform="translate(50, 245)">
    <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ Stunning Architecture &amp; Mech Building Models</text>
    <text x="0" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ High-Precision Bricks Compatible with Major Brands</text>
    <text x="0" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ Perfect Display Models for Desks &amp; Shelves</text>
  </g>

  <rect x="50" y="345" width="220" height="48" rx="8" fill="url(#pink-glow)"/>
  <text x="160" y="375" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle">EXPLORE SETS ↗</text>
</svg>
