    <text x="285" y="116" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">$5.98/yr</text>

    <rect x="20" y="142" width="290" height="42" rx="6" fill="#1e293b"/>
    <text x="35" y="168" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">.org</text>
    <rect x="85" y="155" width="70" height="18" rx="9" fill="rgba(34,197,94,0.15)"/>
    <text x="120" y="168" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AVAILABLE</text>
    <text x="285" y="168" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="end">$7.48/yr</text>

