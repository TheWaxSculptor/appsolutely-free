<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-everblog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow-eb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-everblog)"/>
  <circle cx="700" cy="100" r="160" fill="#10b981" opacity="0.15" filter="url(#glow-eb)"/>
  <circle cx="100" cy="400" r="140" fill="#047857" opacity="0.2" filter="url(#glow-eb)"/>

  <!-- Editorial Card Mockup -->
  <g transform="translate(430, 90)">
    <rect x="0" y="0" width="310" height="260" rx="14" fill="#ffffff" filter="url(#glow-eb)" opacity="0.05"/>
    <rect x="0" y="0" width="310" height="260" rx="14" fill="#022c22" stroke="#059669" stroke-width="2"/>
    <!-- Top toolbar -->
    <rect x="20" y="25" width="60" height="8" rx="4" fill="#10b981"/>
    <rect x="220" y="22" width="70" height="22" rx="11" fill="#10b981" opacity="0.2"/>
    <text x="255" y="37" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PUBLISH</text>

    <!-- Editorial Title lines -->
    <rect x="20" y="65" width="220" height="18" rx="4" fill="#f8fafc"/>
    <rect x="20" y="93" width="160" height="12" rx="4" fill="#94a3b8"/>

    <!-- Paragraph lines -->
    <rect x="20" y="125" width="270" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="143" width="260" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="161" width="240" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="179" width="180" height="8" rx="4" fill="#334155"/>

    <!-- Author Pill -->
    <circle cx="35" cy="225" r="15" fill="#10b981"/>
    <text x="35" y="230" fill="#022c22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">✍</text>
    <rect x="60" y="218" width="100" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="60" y="230" width="60" height="6" rx="3" fill="#64748b"/>
  </g>

  <!-- Typography & Badges -->
  <rect x="50" y="75" width="170" height="32" rx="16" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
  <text x="135" y="96" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">✍️ MODERN PUBLISHING</text>

  <text x="50" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">EVERBLOG US</text>
  <text x="50" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Fast, Minimalist Publishing &amp; Newsletters</text>

  <g transform="translate(50, 245)">
    <text x="0" y="0" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ Distraction-Free Markdown Writing Experience</text>
    <text x="0" y="28" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ Blazing Fast Global CDN &amp; SEO Optimized</text>
    <text x="0" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">✓ Built-In Subscriber Growth &amp; Newsletters</text>
  </g>

  <rect x="50" y="345" width="220" height="48" rx="8" fill="url(#emerald-glow)"/>
  <text x="160" y="375" fill="#022c22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle">START WRITING FREE ↗</text>
</svg>
