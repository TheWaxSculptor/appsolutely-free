name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema pyyaml
      - name: Validate alternatives
        run: check-jsonschema --schemafile schema/alternative.schema.json alternatives/*.yml
      - name: Validate apps
        run: check-jsonschema --schemafile schema/app.schema.json apps/*.yml
      - name: Check references
        run: python scripts/check_refs.py
