<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Appsolutely Free | Modern Open Source Alternatives</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="container">
    <header class="header">
      <div class="logo">App<span>solutely</span> Free</div>
      <p class="subtitle">Ditch the subscriptions. Find powerful, open-source alternatives to the software you're paying for.</p>
    </header>

    <main>
      <div class="search-container glass-panel">
        <input type="text" id="appSearch" class="search-input" placeholder="Search for an app (e.g., Photoshop, Figma...)">
        <div class="search-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </div>

      <div id="resultsArea" class="results-area hidden">
        <!-- Results will be injected here by app.js -->
      </div>
      
      <div id="initialState" class="initial-state">
        <div class="popular-apps glass-panel">
          <h3>Popular Searches</h3>
          <div class="chips" id="popularChips">
            <!-- Chips will be generated -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
